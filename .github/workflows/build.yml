name: Build Redpencil Phone APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack app source
        run: |
          echo '' | base64 -d > src.tar.xz
          mkdir app && tar -xJf src.tar.xz -C app && ls -R app | head -40
      - name: Make icons
        working-directory: app
        run: pip install pillow && python3 make_icons.py && python3 ../make_logo_icons.py && cp ../app-config.js www/config.js && cp ../ringtone.js www/ringtone.js && sed -i 's|</body>|<script src="ringtone.js"></script></body>|' www/index.html && grep -c ringtone.js www/index.html && cat www/config.js && ls www/icons assets
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Bundle libraries
        working-directory: app
        run: |
          mkdir -p www/vendor libs && cd libs && npm init -y >/dev/null
          npm install firebase@10.12.2 jssip@3.10.1 esbuild@0.24.0
          for f in app auth firestore; do cp node_modules/firebase/firebase-$f-compat.js ../www/vendor/; done
          echo "window.JsSIP=require('jssip');" > entry.js
          npx esbuild entry.js --bundle --minify --format=iife --outfile=../www/vendor/jssip.min.js
          cd .. && rm -rf libs && ls -la www/vendor
      - name: Create Android project
        working-directory: app
        run: |
          npm install
          npx cap add android
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-feature android:name="android.hardware.microphone" android:required="false" />#' $M
          grep -q RECORD_AUDIO $M
      - name: App icon
        continue-on-error: true
        working-directory: app
        run: npx capacitor-assets generate --android --iconBackgroundColor '#FFFFFF' --splashBackgroundColor '#FBF7F4'
      - name: Build APK
        working-directory: app
        run: |
          npx cap sync android
          sed -i 's/minSdkVersion = 22/minSdkVersion = 24/' android/variables.gradle
          sed -i "s/versionCode 1$/versionCode $GITHUB_RUN_NUMBER/; s/versionName \"1.0\"/versionName \"1.0.$GITHUB_RUN_NUMBER\"/" android/app/build.gradle
          grep -n "minSdkVersion\|versionCode\|versionName" android/variables.gradle android/app/build.gradle
          cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release-unsigned.apk ../../RedpencilPhone-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: RedpencilPhone-APK
          path: RedpencilPhone-unsigned.apk
      - name: Publish as release download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Redpencil Phone 1.0.${{ github.run_number }}
          files: RedpencilPhone-unsigned.apk
