name: Verify signed APK with official Android tools
on:
  push:
    paths: ['.github/workflows/verify.yml']
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Rebuild signed 1.0.4 and run apksigner
        env:
          V2: 
          PADLEN: '1743'
        run: |
          curl -sSL -o u.apk https://github.com/biplabbiprodas-glitch/redpencil/releases/download/v1.0.4/RedpencilPhone-unsigned.apk
          python3 - <<'PY'
          import struct, base64, os, hashlib
          v2 = base64.b64decode(os.environ['V2']); pad = int(os.environ['PADLEN'])
          body = struct.pack('<Q', 4 + len(v2)) + struct.pack('<I', 0x7109871a) + v2 + struct.pack('<Q', 4 + pad) + struct.pack('<I', 0x42726577) + bytes(pad)
          sz = len(body) + 24
          blk = struct.pack('<Q', sz) + body + struct.pack('<Q', sz) + b'APK Sig Block 42'
          u = open('u.apk', 'rb').read()
          e = u.rfind(b'PK\x05\x06'); cd_size, cd_off = struct.unpack('<II', u[e+12:e+20])
          s = u[:cd_off] + blk + u[cd_off:e+16] + struct.pack('<I', cd_off + len(blk)) + u[e+20:]
          open('signed.apk', 'wb').write(s)
          print('unsigned', hashlib.sha256(u).hexdigest()); print('signed', hashlib.sha256(s).hexdigest())
          PY
          BT=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          echo "build-tools: $BT"
          echo '## apksigner verify' >> $GITHUB_STEP_SUMMARY
          $BT/apksigner verify --verbose --print-certs signed.apk 2>&1 | tee -a $GITHUB_STEP_SUMMARY
          echo '## zipalign check' >> $GITHUB_STEP_SUMMARY
          ($BT/zipalign -c -v -p 4 signed.apk 2>&1 | tail -3 | tee -a $GITHUB_STEP_SUMMARY) || true
          echo '## badging' >> $GITHUB_STEP_SUMMARY
          $BT/aapt2 dump badging signed.apk 2>&1 | head -4 | tee -a $GITHUB_STEP_SUMMARY
